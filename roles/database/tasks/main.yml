---
- name: Installera MariaDB och Pythonbiblioteket för MySQL
  ansible.builtin.apt:
    name:
      - mariadb-server
      - python3-pymysql
    state: present
    update_cache: true

- name: Tillåt anslutningar från andra servrar
  ansible.builtin.copy:
    dest: /etc/mysql/mariadb.conf.d/99-bind.cnf
    content: |
      [mysqld]
      bind-address = 0.0.0.0
    mode: "0644"
  notify: Starta om MariaDB

- name: Se till att MariaDB är igång och startar vid boot
  ansible.builtin.service:
    name: mariadb
    state: started
    enabled: true

- name: Skapa databasen labbdb
  community.mysql.mysql_db:
    name: labbdb
    state: present
    login_user: root
    login_unix_socket: /run/mysqld/mysqld.sock

- name: Skapa användaren appuser som får logga in från andra servrar
  community.mysql.mysql_user:
    name: appuser
    host: "%"
    password: "{{ vault_db_password }}"
    priv: "labbdb.*:ALL"
    state: present
    login_user: root
    login_unix_socket: /run/mysqld/mysqld.sock
  no_log: true

- name: Skapa tabellen och lägg in ett meddelande
  community.mysql.mysql_query:
    login_db: labbdb
    login_user: root
    login_unix_socket: /run/mysqld/mysqld.sock
    query:
      - CREATE TABLE IF NOT EXISTS meddelanden (id INT PRIMARY KEY, text VARCHAR(255))
      - INSERT IGNORE INTO meddelanden (id, text) VALUES (1, 'Hej från databasen på node2!')
